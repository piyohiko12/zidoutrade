name: Synthetic bug report
description: Report a reproducible issue without account or market data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include account IDs, order IDs, prices, balances, positions, PnL, credentials, or runtime artifacts.
  - type: textarea
    id: invariant
    attributes:
      label: Safety invariant affected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide only synthetic inputs and fake-broker behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected fail-closed behavior
    validations:
      required: true
